<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Conference-Map_Oddysey</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=300 height=800 tabindex="-1" style="width: 400px; height: 800px; background: #231F20"></canvas>
	<div inert
	 id="reader"
	 style="
		width:300px;
		height:300px;
		top: 100px;
		left: 50%;
		position: absolute;
		display: none;
		z-index:50;">
	</div>
	  <script src="TemplateData/profiler.js"></script>
	  <script src="html5-qrcode.min.js"></script>
	  <script src="QRScanner.js"></script>
    <script src="Build/Conference-Game-Oddysey-WEB.loader.js"></script>
    <script>
     
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

		  createUnityInstance(document.querySelector("#unity-canvas"), {
			arguments: [],
			dataUrl: "Build/Conference-Game-Oddysey-WEB.data.br",
			frameworkUrl: "Build/Conference-Game-Oddysey-WEB.framework.js.br",
			codeUrl: "Build/Conference-Game-Oddysey-WEB.wasm.br",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "Swordfish",
			productName: "Conference-Map_Oddysey",
			productVersion: "0.5",
			// matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
			// devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
		  }).then((unityInstance) => {
				window.unityInstance = unityInstance;
		  }).catch((message) => {
			alert(message);
		  });	  
    </script>
  </body>
</html>
